[project]
name = "sufe_saads_crewai"
version = "0.2.0"
description = "LLM security intelligence collection agent and console"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "claude-agent-sdk>=0.2.115,<0.3",
    "pydantic>=2.7",
    "pymongo>=4.6",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1.1",
    "gradio>=5.0.0,<6.0.0",
    "matplotlib>=3.10.9",
    "scikit-learn>=1.5,<2",
    "numpy>=1.26,<3",
]

[project.scripts]
saads-api = "intel_agent.api:main"
intel-api = "intel_agent.api:main"
intel-agent = "intel_agent.cli:main"
intel_full = "intel_agent.cli:run_full"
intel_incremental = "intel_agent.cli:run_incremental"
intel_latest = "intel_agent.cli:show_latest"
web = "console.app:main"

[dependency-groups]
agentsdk = [
    "claude-agent-sdk>=0.2.115,<0.3",
]
intelagent = [
    "claude-agent-sdk>=0.2.115,<0.3",
    "pydantic>=2.7",
    "pymongo>=4.6",
]
web = [
    "gradio>=5.0.0,<6.0.0",
    "claude-agent-sdk>=0.2.115,<0.3",
    "pydantic>=2.7",
    "pymongo>=4.6",
]
dev = [
    "pytest>=9.0.3",
    "mongomock>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/common", "backend/intel_agent", "backend/console", "backend/sandbox_agent", "backend/red_team", "backend/pentest_agent"]

[tool.pytest.ini_options]
norecursedirs = ["runtime", ".venv", ".git", "__pycache__"]

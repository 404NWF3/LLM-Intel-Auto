[project]
name = "SAADA"
version = "0.1.0"
description = "基于多智能体的 AI 系统态势感知与自动化防御系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-google-genai>=4.2.0",
    "langgraph>=0.2.0",
    "google-adk>=1.22.1",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "websockets>=15.0.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "qdrant-client>=1.13.0",
    "langchain-qdrant>=0.2.0",
    "aiosqlite>=0.20.0",
    "psycopg>=3.2.0",
    "psycopg_pool>=3.2.0",
    # "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

# 本地 Embedding 支持（不依赖 OpenAI API）
local-embed = [
    "sentence-transformers>=3.0.0",
]

[project.scripts]
saads = "main:main"

[tool.setuptools.packages.find]
include = ["backend*", "skills*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

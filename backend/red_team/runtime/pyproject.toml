[project]
name = "llm-defense-graphrag"
version = "0.1.0"
description = "Auditable LLM defense corpus and Microsoft GraphRAG project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13",
    "claude-agent-sdk==0.2.122",
    "graphrag==3.1.1",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_defense_graphrag", "saads_attack_agent", "saads_grill_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
addopts = "--import-mode=importlib"

### This config file contains required core defaults that must be set, along with a handful of common optional settings.
### For a full list of available settings, see https://microsoft.github.io/graphrag/config/yaml/

### LLM settings ###
## GLM handles completions; Zhipu / Z.AI handles embeddings.
## Both use Z.AI's OpenAI-compatible API and load credentials from .env.

completion_models:
  default_completion_model:
    type: glm_json_object
    model_provider: openai
    model: ${ZAI_CHAT_MODEL}
    auth_method: api_key
    api_key: ${ZAI_API_KEY}
    api_base: ${ZHIPU_API_BASE}
    call_args:
      extra_body:
        thinking:
          type: disabled
    retry:
      type: exponential_backoff
      max_retries: 8
      base_delay: 2
      max_delay: 60
      jitter: true
    # Bound bursts so retries and completion spend remain predictable. Do not run
    # multiple index processes against the same output directory.
    rate_limit:
      type: sliding_window
      period_in_seconds: 10
      requests_per_period: 20

embedding_models:
  default_embedding_model:
    model_provider: openai
    model: ${ZHIPU_EMBEDDING_MODEL}
    auth_method: api_key
    api_key: ${ZHIPU_API_KEY}
    api_base: ${ZHIPU_API_BASE}
    call_args:
      dimensions: ${ZHIPU_EMBEDDING_DIMENSIONS}
    retry:
      type: exponential_backoff
      max_retries: 8
      base_delay: 2
      max_delay: 60
      jitter: true
    rate_limit:
      type: sliding_window
      period_in_seconds: 10
      requests_per_period: 5

### Document processing settings ###

input:
  type: json
  file_pattern: ".*summary_corpus\\.json$$"
  encoding: utf-8
  id_column: id
  title_column: title
  text_column: text

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: cl100k_base
  prepend_metadata: []

### Storage settings ###
## If blob storage is specified in the following four sections,
## connection_string and container_name must be provided

input_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "summary_input"

output_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "output"

reporting:
  type: file # [file, blob]
  base_dir: "logs"

cache:
  type: json # [json, memory, none]
  storage:
    type: file # [file, blob, cosmosdb]
    # Use a new namespace so the summary-only GLM index cannot reuse responses
    # from previous models or corpora.
    base_dir: "cache/glm-4.5-air-summary-20260713-v1"
    
vector_store:
  type: lancedb
  db_uri: output/lancedb
  vector_size: ${ZHIPU_EMBEDDING_DIMENSIONS}

### Workflow settings ###

embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  entity_types:
    - ATTACK_TECHNIQUE
    - DEFENSE_CONTROL
    - COMPONENT
    - VULNERABILITY
    - TOOL
    - STANDARD
    - EVALUATION
  max_gleanings: 0

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english # [regex_english, syntactic_parser, cfg]

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: false
  embeddings: false

### Query settings ###
## The prompt locations are required here, but each search method has a number of optional knobs that can be tuned.
## See the config docs: https://microsoft.github.io/graphrag/config/yaml/#query

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: default_completion_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_search_reduce_prompt.txt"

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"

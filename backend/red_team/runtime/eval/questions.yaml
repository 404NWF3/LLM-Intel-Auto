version: 1
language: zh-CN
manual_checks:
  - answer_is_grounded_in_indexed_sources
  - attack_and_defense_are_not_confused
  - relationship_direction_is_correct
  - uncertainty_or_missing_evidence_is_disclosed
routing:
  basic: 定义、原文定位和单一来源事实
  local: 具体实体、邻接关系和局部缓解措施
  global: 跨社区主题、领域全景和共性模式
  drift: 跨组件、多跳依赖和纵深防御方案
questions:
